version: 2
updates:
  # ==================== NuGet Package Updates ====================
  # Scenario 1: Time Zone Agent (Intro)
  # Includes prerelease packages (Azure.AI.AgentServer.AgentFramework, Azure.AI.OpenAI)
  # and community packages (ElBruno.Text2Image)
  - package-ecosystem: "nuget"
    directory: "/scenario-1-intro"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"

  # Scenario 2: Data Crunch Agent
  # Same pattern as Scenario 1
  - package-ecosystem: "nuget"
    directory: "/scenario-2-data-crunch"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"

  # Scenario 3: Image Generator Agent
  # Includes prerelease packages (Azure.AI.AgentServer.AgentFramework, Azure.AI.OpenAI)
  # and ElBruno.Text2Image for FLUX.2 image generation
  - package-ecosystem: "nuget"
    directory: "/scenario-3-image-gen"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"

  # Scenario 4: Code Metrics Agent
  # Lightweight metrics analysis agent
  - package-ecosystem: "nuget"
    directory: "/scenario-4-code-metrics"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"

  # ==================== Docker Base Image Updates ====================
  # Scenario 1: Time Zone Agent (Alpine-based .NET SDK)
  - package-ecosystem: "docker"
    directory: "/scenario-1-intro/src/time-zone-agent"
    schedule:
      interval: "weekly"

  # Scenario 2: Data Crunch Agent (Alpine-based .NET SDK)
  - package-ecosystem: "docker"
    directory: "/scenario-2-data-crunch/src/DataCrunchAgent"
    schedule:
      interval: "weekly"

  # Scenario 3: Image Generator Agent (Debian-based .NET SDK for CUDA compatibility)
  - package-ecosystem: "docker"
    directory: "/scenario-3-image-gen/src/HostedAgent"
    schedule:
      interval: "weekly"

  # Scenario 4: Code Metrics Agent (Alpine-based .NET SDK)
  - package-ecosystem: "docker"
    directory: "/scenario-4-code-metrics/src/CodeMetricsAgent"
    schedule:
      interval: "weekly"

  # ==================== GitHub Actions Updates ====================
  # Workflow action versions (ci.yml, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
